# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

#Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=true

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mydatabase}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Datasource Initialization
spring.jpa.defer-datasource-initialization=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=false

# Application Name
spring.application.name=api-restaurante

# Logging
logging.level.root=INFO
logging.level.br.com.tech.challenger=DEBUG
logging.level.org.flywaydb=INFO

# Security
security.secret=${JWT_SECRET_KEY:chave_de_seguranca}
security.expiration.minutes=${JWT_EXPIRATION_MINUTES:60}

# Server error
spring.web.error.include-stacktrace=never